name: Swift package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Thread Sanitizer
        run: NSUnbufferedIO=YES swift test --sanitize=thread
      - name: Release build
        run: swift build -c release
      - name: DocC
        run: >-
          xcodebuild
          docbuild
          -scheme SpacetimeDB
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/SpacetimeDBDocC"
          CODE_SIGNING_ALLOWED=NO
      - name: Benchmark package manifest
        run: swift package --package-path Benchmarks describe
      - name: Verify no tracked drift
        run: git diff --exit-code

  apple-platforms:
    name: ${{ matrix.name }} build
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: visionOS Simulator
            destination: generic/platform=visionOS Simulator
          - name: watchOS Simulator
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Build SpacetimeDB
        run: >-
          xcodebuild
          -scheme SpacetimeDB
          -destination '${{ matrix.destination }}'
          -configuration Release
          CODE_SIGNING_ALLOWED=NO
          build
